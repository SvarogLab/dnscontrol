name: CI

on:
  push:
    branches: [main]
  pull_request:
  # An advisory published against a locked version reaches no pull request: only the audit on main
  # shows it.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  rust:
    uses: SvarogLab/.github/.github/workflows/rust.yml@feat/image-and-chart-workflows
    with:
      binaries: dnscontrol

  helm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: helm lint
        run: |
          helm lint helm --strict
          helm lint helm --strict -f .ci/helm-values.yaml

      - name: helm template
        run: |
          helm template ci helm > /dev/null
          helm template ci helm -f .ci/helm-values.yaml > /dev/null

      # The chart deploys DNS automation; a mutable tag would silently change what runs.
      - name: the rendered image tag must be immutable
        run: |
          image=$(helm template ci helm | grep -oE 'image: "[^"]+"' | head -1)
          echo "$image"
          case "$image" in
            "") echo "::error::the chart rendered no image reference"; exit 1 ;;
            *:latest\"|*:\") echo "::error::rendered a mutable image tag: $image"; exit 1 ;;
          esac

      - name: the guards must fire
        run: |
          if helm template ci helm --set image.tag=latest >/dev/null 2>&1; then
            echo "::error::image.tag=latest was accepted"; exit 1
          fi
          if helm template ci helm --set config.existingConfigMap=null >/dev/null 2>&1; then
            echo "::error::a missing existingConfigMap was accepted"; exit 1
          fi

      # Requests and limits belong to the deployment, which knows its cluster and its zone count.
      - name: resources come from the values, never from the chart
        run: |
          if helm template ci helm | grep -q 'resources:'; then
            echo "::error::the chart rendered resources of its own"; exit 1
          fi
          helm template ci helm -f .ci/helm-values.yaml | grep -q 'memory: 48Mi' \
            || { echo "::error::resources from the values were not rendered"; exit 1; }

  image-check:
    if: github.event_name == 'pull_request'
    uses: SvarogLab/.github/.github/workflows/image.yml@feat/image-and-chart-workflows
    permissions:
      contents: read
      packages: write
    with:
      push: false
      binaries: dnscontrol

  tag:
    needs: [rust, helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: SvarogLab/.github/.github/workflows/tag-release.yml@feat/image-and-chart-workflows
    permissions:
      contents: write

  image:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: SvarogLab/.github/.github/workflows/image.yml@feat/image-and-chart-workflows
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.tag.outputs.tag }}

  chart:
    needs: [tag, image]
    uses: SvarogLab/.github/.github/workflows/chart.yml@feat/image-and-chart-workflows
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.tag.outputs.tag }}

  release:
    needs: [tag, chart]
    uses: SvarogLab/.github/.github/workflows/release.yml@feat/image-and-chart-workflows
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
      download-binaries: true
      download-chart: true
      prepare: |
        cp binaries/amd64/release/dnscontrol dnscontrol-linux-amd64
        cp binaries/arm64/release/dnscontrol dnscontrol-linux-arm64
      assets: dnscontrol-linux-amd64 dnscontrol-linux-arm64
