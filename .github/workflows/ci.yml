name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test

      - name: build
        run: cargo build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5

      - name: helm lint
        run: |
          helm lint helm --strict
          helm lint helm --strict -f .ci/helm-values.yaml

      - name: helm template
        run: |
          helm template ci helm > /dev/null
          helm template ci helm -f .ci/helm-values.yaml > /dev/null

      # The chart deploys DNS automation; a mutable tag would silently change what runs.
      - name: the rendered image tag must be immutable
        run: |
          image=$(helm template ci helm | grep -oE 'image: "[^"]+"' | head -1)
          echo "$image"
          case "$image" in
            "") echo "::error::the chart rendered no image reference"; exit 1 ;;
            *:latest\"|*:\") echo "::error::rendered a mutable image tag: $image"; exit 1 ;;
          esac

      - name: the guards must fire
        run: |
          if helm template ci helm --set image.tag=latest >/dev/null 2>&1; then
            echo "::error::image.tag=latest was accepted"; exit 1
          fi
          if helm template ci helm --set config.existingConfigMap=null >/dev/null 2>&1; then
            echo "::error::a missing existingConfigMap was accepted"; exit 1
          fi

      # Requests and limits belong to the deployment, which knows its cluster and its zone count.
      - name: resources come from the values, never from the chart
        run: |
          if helm template ci helm | grep -q 'resources:'; then
            echo "::error::the chart rendered resources of its own"; exit 1
          fi
          helm template ci helm -f .ci/helm-values.yaml | grep -q 'memory: 48Mi' \
            || { echo "::error::resources from the values were not rendered"; exit 1; }

  # Separate job (not folded into `check`) so an advisory hit is unambiguous in the PR checks
  # list, rather than buried in the same log as an unrelated clippy/test failure.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
