# Triggered by the `vX.Y.Z` tag pushed after a release commit bumping Cargo.toml's version.
# Produces both artifacts: a multi-arch image on GHCR (what the Helm chart deploys) and the two
# raw binaries attached to a GitHub Release (so the tool is usable without a cluster).
#
# Cross-compiles via cargo-zigbuild rather than letting buildx run `cargo build` under QEMU for
# the arm64 leg - a full rustc build segfaults under emulation.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Runs before anything is built or pushed: a tag that disagrees with Cargo.toml would otherwise
  # publish an image whose --version output contradicts its own tag.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verify Cargo.toml version matches the tag
        run: |
          crate_version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$crate_version" != "${{ github.ref_name }}" ]; then
            echo "::error::Cargo.toml version ($crate_version) does not match tag (${{ github.ref_name }})"
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Cross-compile
        run: cargo zigbuild --release --target ${{ matrix.rust_target }}

      # The Dockerfile packages from target/<TARGETARCH>/release/, which buildx sets per platform.
      - name: Stage binary at its TARGETARCH path
        run: |
          mkdir -p target/${{ matrix.arch }}/release
          cp target/${{ matrix.rust_target }}/release/dnscontrol target/${{ matrix.arch }}/release/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Stage binary under its release name
        run: |
          mkdir -p /tmp/dist
          cp target/${{ matrix.rust_target }}/release/dnscontrol /tmp/dist/dnscontrol-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: dnscontrol-linux-${{ matrix.arch }}
          path: /tmp/dist/dnscontrol-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` exists only for manual pokes - the Helm chart always pins the immutable vX.Y.Z.
      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

  release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/dist
          pattern: dnscontrol-linux-*
          merge-multiple: true

      - name: Create GitHub Release with both binaries attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            /tmp/dist/dnscontrol-linux-amd64 /tmp/dist/dnscontrol-linux-arm64 \
            --title "${{ github.ref_name }}" \
            --generate-notes
