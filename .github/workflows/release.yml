# Triggered by the `vX.Y.Z` tag pushed after a release commit bumping Cargo.toml's version.
# Produces every artifact: a multi-arch image on GHCR, the Helm chart that deploys it (an OCI
# artifact on GHCR), and a GitHub Release carrying the chart archive and the two raw binaries (so
# the tool is usable without a cluster).
#
# Cross-compiles via cargo-zigbuild rather than letting buildx run `cargo build` under QEMU for
# the arm64 leg - a full rustc build segfaults under emulation.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write
jobs:
  # Runs before anything is built or pushed: a tag that disagrees with Cargo.toml would otherwise
  # publish an image whose --version output contradicts its own tag.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verify Cargo.toml version matches the tag
        run: |
          crate_version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$crate_version" != "${{ github.ref_name }}" ]; then
            echo "::error::Cargo.toml version ($crate_version) does not match tag (${{ github.ref_name }})"
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # github.repository keeps the owner's original casing, and an OCI reference must be
      # lowercase - "ghcr.io/SvarogLab/..." is rejected outright.
      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Cross-compile
        run: cargo zigbuild --release --target ${{ matrix.rust_target }}

      # The Dockerfile packages from target/<TARGETARCH>/release/, which buildx sets per platform.
      - name: Stage binary at its TARGETARCH path
        run: |
          mkdir -p target/${{ matrix.arch }}/release
          cp target/${{ matrix.rust_target }}/release/dnscontrol target/${{ matrix.arch }}/release/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Stage binary under its release name
        run: |
          mkdir -p /tmp/dist
          cp target/${{ matrix.rust_target }}/release/dnscontrol /tmp/dist/dnscontrol-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: dnscontrol-linux-${{ matrix.arch }}
          path: /tmp/dist/dnscontrol-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # github.repository keeps the owner's original casing, and an OCI reference must be
      # lowercase - "ghcr.io/SvarogLab/..." is rejected outright.
      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` exists only for manual pokes - the Helm chart always pins the immutable vX.Y.Z.
      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

  # After the image, so a published chart never points at an image that does not exist yet.
  #
  # Pushed under the repository path, not the bare owner: `helm push` names the artifact after the
  # chart, so oci://ghcr.io/svaroglab would land it on ghcr.io/svaroglab/dnscontrol - the image
  # itself. Under the repository path it becomes ghcr.io/svaroglab/dnscontrol/dnscontrol.
  chart:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5

      # The tag is the one version source for the chart and its default image tag. The image is
      # tagged vX.Y.Z, so appVersion keeps the v; a chart version has to be bare semver.
      - name: Package and push
        env:
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oci="oci://ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          helm package helm --version "${TAG#v}" --app-version "$TAG"
          echo "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dnscontrol-${TAG#v}.tgz" "$oci"

      # The same archive that was pushed, so the release asset and the OCI artifact are one chart.
      - uses: actions/upload-artifact@v4
        with:
          name: dnscontrol-chart
          path: dnscontrol-*.tgz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [merge, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/dist
          pattern: dnscontrol-*
          merge-multiple: true

      # The tag's own CHANGELOG.md section becomes the body, so the release and the file cannot
      # disagree. Empty means the changelog was not updated before tagging - fail rather than
      # publish a release that says nothing.
      - name: Take the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v hdr="## [${TAG#v}]" 'index($0, hdr) == 1 {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

      - name: Create GitHub Release with both binaries and the chart attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            /tmp/dist/dnscontrol-linux-amd64 /tmp/dist/dnscontrol-linux-arm64 \
            /tmp/dist/dnscontrol-*.tgz \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/notes.md \
            --generate-notes
